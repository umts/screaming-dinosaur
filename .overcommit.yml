CommitMsg:
  ALL:
    enabled: false
PreCommit:
  ALL:
    problem_on_unmodified_line: ignore
    skip_if: ["test", "-f", ".git/MERGE_HEAD"]
  ForbiddenBranches:
    enabled: true
    branch_patterns: ["master", "main"]
  HamlLint:
    enabled: true
    on_warn: fail
    required_executable: bundle
    command: ["bundle", "exec", "haml-lint"]
  OxFmt:
    enabled: true
    required_executable: npx
    command: ["npx", "oxfmt"]
    # TODO: Remove when upstreamed.
    include:
      - "**/*.js"
      - "**/*.ts"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
  OxLint:
    enabled: true
    required_executable: npx
    command: ["npx", "oxlint"]
    # TODO: Remove when upstreamed.
    include:
      - "**/*.js"
      - "**/*.ts"
  RuboCop:
    enabled: true
    required_executable: bundle
    command: ["bundle", "exec", "rubocop"]
  Stylelint:
    enabled: true
    required_executable: npx
    command: ["npx", "stylelint"]
PrePush:
  Brakeman:
    enabled: true
    required_executable: bundle
    command: ["bundle", "exec", "brakeman", "--no-pager"]
